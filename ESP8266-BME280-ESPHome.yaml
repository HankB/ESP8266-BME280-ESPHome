esphome:
  name: esp8266-538340

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key 

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bme280-Test Fallback Hotspot"
    password: "ZNZJHJ5gkVZr"

i2c:
  sda: D3
  scl: D4
  scan: true

# configure BME280
sensor:
  - platform: bme280_i2c
    temperature:
      name: "lab Temperature"
    pressure:
      name: "lab Pressure"
    humidity:
      name: "lab Humidity"
    address: 0x76
    update_interval: 60s

captive_portal:
    